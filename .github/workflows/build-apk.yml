name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v3

      - name: Node.js Kur
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Java JDK Kur
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Paketleri ve Android APK'yı Derle
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init FlameStore com.flamestore.app --web-dir .
          npx cap add android
          if [ -f "assets/icon.png" ]; then npx @capacitor/assets generate --android; fi
          npx cap sync
          cd android && ./gradlew assembleDebug

      - name: APK Dosyasını Çıkar
        uses: actions/upload-artifact@v3
        with:
          name: FlameStore-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
