name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java JDK Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Paketleri ve APK'yı Derle
        run: |
          mkdir -p www
          cp -r index.html assets *.html *.css *.js www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init FlameStore com.flamestore.app --web-dir www
          npx cap add android
          if [ -f "assets/icon.png" ]; then npx @capacitor/assets generate --android; fi
          npx cap sync
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: FlameStore-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
